name: Prepare next edition
on:
  schedule:
    # Covers daylight and standard time. The local-time gate runs only one daily.
    - cron: '17 13,14 * * *'
  workflow_dispatch:
permissions:
  contents: write
  issues: read
  pages: write
  id-token: write
concurrency:
  group: rally-edition
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      publish: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check local publication hour
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          config = json.load(open('config.json'))
          today = datetime.now(ZoneInfo(config['timezone']))
          should_run = os.environ['EVENT_NAME'] == 'workflow_dispatch' or today.hour == 8
          index = json.load(open('data/index.json'))
          latest = json.load(open('data/editions/' + index['editions'][0] + '.json'))
          if os.environ['EVENT_NAME'] != 'workflow_dispatch' and not latest.get('seed') and latest['date'] == str(today.date()):
              should_run = False
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('run=' + str(should_run).lower() + '\n')
          PY
      - name: Test before research
        if: steps.gate.outputs.run == 'true'
        run: python -m unittest discover -s tests -v
      - name: Research and prepare the next edition
        if: steps.gate.outputs.run == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate.py
      - name: Save edition and editorial memory
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name 'rally-editor[bot]'
          git config user.email 'rally-editor[bot]@users.noreply.github.com'
          git add data
          git commit -m 'Publish the next source-linked Rally edition'
          git push
  publish:
    needs: research
    if: needs.research.outputs.publish == 'true'
    uses: ./.github/workflows/pages.yml
