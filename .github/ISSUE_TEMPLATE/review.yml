name: Share feedback on Rally
description: Leave a comment, with optional score / 留言即可，评分为可选项。
title: "[Review] "
body:
  - type: markdown
    attributes:
      value: "Leave a comment in English or Chinese. Scores and preferences are optional. This feedback is public. / 欢迎中英文留言，评分与偏好均可不填。留言公开可见。"
  - type: input
    id: edition
    attributes:
      label: Edition ID
      description: Keep the ID filled in by the website.
    validations:
      required: true
  - type: input
    id: story
    attributes:
      label: Story ID
      description: Keep the story ID, or use edition for feedback on the whole edit.
    validations:
      required: true
  - type: dropdown
    id: score
    attributes:
      label: Score
      description: "Optional: choose 1–5 / 可选评分；仅留言也会被考虑。"
      options:
        - "Select a score / 请选择评分"
        - "1 — Not useful"
        - "2 — A little useful"
        - "3 — Good"
        - "4 — Very good"
        - "5 — Excellent"
    validations:
      required: false
  - type: dropdown
    id: direction
    attributes:
      label: What should we change?
      options:
        - "Select a preference / 请选择"
        - More like this
        - Keep the mix
        - Less like this
        - Already seen / repetitive
        - Check the facts or source
    validations:
      required: false
  - type: textarea
    id: comment
    attributes:
      label: Your thoughts
      description: English or Chinese welcome / 欢迎用中文或英文评论。你喜欢什么？下一期希望看到什么？也欢迎纠错和提供来源链接。
      placeholder: "For example: More affordable court fashion and women-led club stories."
    validations:
      required: true
